version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pg_database
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PG_LOCAL_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro   # SQL files here run once on first boot
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  importer:
    build:
      context: .
      dockerfile: importer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_LOCAL_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPREADSHEET_DIR: /spreadsheets
    volumes:
      - ./spreadsheets:/spreadsheets # Spreadsheets here
    networks:
      - app-network

networks:
  app-network:
    name: app-network 
    driver: bridge

volumes:
  pg_data:

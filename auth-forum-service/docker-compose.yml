version: "3.9"
services:

  auth-forum-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-forum-service
    restart: unless-stopped
    environment:
      SERVER_PORT: ${AUTH_FORUM_SERVER_PORT:-8082}
      USER_GRPC_PORT: ${USER_GRPC_PORT:-50053}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-pg_database}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-myDB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
    ports:
      - "${AUTH_FORUM_SERVER_PORT:-8082}:${AUTH_FORUM_SERVER_PORT:-8082}"
    networks:
      - app-network


networks:
  app-network:
    name: app-network
    driver: bridge

# Uso apenas para desenvolvimento local, não é recomendado para produção. Para produção, considere usar um serviço de banco de dados gerenciado ou configurar o banco de dados em um contêiner separado com persistência adequada.

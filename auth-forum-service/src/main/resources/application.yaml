server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: auth-forum-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
  cloud:
    gcp:
      secretmanager:
        enabled: true
      project-id: cloud-computing-proj-2026

management:
  endpoints:
    web:
      exposure:
        include: health,info,*
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    net.devh.boot.grpc.client: DEBUG
    io.grpc: DEBUG
    juliana.auth_forum_service.service: DEBUG

grpc:
  client:
    userService:
      address: static://user-service:${USER_GRPC_PORT:50053}
      negotiationType: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
      enableRetry: true
      maxRetryAttempts: 5
      retryBufferSize: 16777216
      maxRetryBufferSize: 16777216



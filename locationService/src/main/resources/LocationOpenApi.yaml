openapi: 3.0.4
info:
  title: "Migration Service: Location API"
  version: '1.0.0'
  description: >-
    Comparator of metrics for different European countries. Use cases assigned
    to André Franco 59876.
    Its recommended to test this service after Auth-Forum and before User.
servers:
  - url: <linkIsInMoodle>/api/v1
    description: Cloud Server

paths:

  /locations:
    get:
      summary: List available locations
      description: >
        Returns the list of European locations available on the platform.
        Supports the use case "View List of Countries".
      operationId: listLocations
      responses:
        "200":
          description: List of locations returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationSummary"

  /locations/{id}:
    get:
      summary: Get location data
      description: >
        Returns the general data and metrics of a specific location
        identified by its internal ID.
        Supports the use case "View data of a country".
      operationId: getLocation
      parameters:
        - name: id
          in: path
          required: true
          description: Internal location identifier.
          schema:
            type: integer
            example: 1
        - name: year
          in: query
          required: false
          description: Filter metrics by year. If omitted, returns the most recent year.
          schema:
            type: integer
            example: 2023
      responses:
        "200":
          description: Location returned successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/LocationSummary"
                  - type: object
                    properties:
                      metrics:
                        type: array
                        items:
                          $ref: "#/components/schemas/Metric"
        "404":
          description: Location not found.
          content:
            application/json:
              schema:
                type: string
                example: "Location not found"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: string
                example: "Internal server error"


  /locations/code/{code}:
    get:
      summary: Get location by country code
      description: >
        Returns the general data and metrics of a location
        identified by its ISO 3166-1 alpha-2 country code.
      operationId: getLocationByCode
      parameters:
        - name: code
          in: path
          required: true
          description: ISO 3166-1 alpha-2 country code (e.g. PT, DE, FR).
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: "PT"
        - name: year
          in: query
          required: false
          description: Filter metrics by year. If omitted, returns the most recent year.
          schema:
            type: integer
            example: 2023
      responses:
        "200":
          description: Location returned successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/LocationSummary"
                  - type: object
                    properties:
                      metrics:
                        type: array
                        items:
                          $ref: "#/components/schemas/Metric"
        "400":
          description: Invalid parameters.
          content:
            application/json:
              schema:
                type: string
                example: "Invalid ISO code"
        "404":
          description: Location not found.
          content:
            application/json:
              schema:
                type: string
                example: "Location not found"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: string
                example: "Internal server error"

  /locations/compare:
    get:
      summary: Compare locations
      description: >
        Returns the metrics of multiple locations side by side.
        If the metrics parameter is omitted, all available metrics are compared.
        Supports the use case "Comparison between two countries".
      operationId: compareLocations
      parameters:
        - name: ids
          in: query
          required: true
          description: Location identifiers to compare (minimum 2, comma-separated).
          schema:
            type: array
            items:
              type: integer
            minItems: 2
          style: form
          explode: false
          example: [1, 2]
        - name: metrics
          in: query
          required: false
          description: Filter by specific metrics. If omitted, returns all.
          schema:
            type: array
            items:
              type: string
              enum:
                - pli
                - hpi
                - crime
                - air_quality
                - transport
                - health
                - unemployment
                - working_hours
                - life_expectancy
          style: form
          explode: false
          example: [pli, hpi, crime]
      responses:
        "200":
          description: Comparison returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/LocationSummary"
                    - type: object
                      properties:
                        metrics:
                          type: array
                          items:
                            $ref: "#/components/schemas/Metric"
        "400":
          description: Invalid or missing parameters.
          content:
            application/json:
              schema:
                type: string
                example: "At least 2 location ids are required"
        "404":
          description: One or more locations not found.
          content:
            application/json:
              schema:
                type: string
                example: "One or more locations not found"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: string
                example: "Internal server error"

  /locations/top:
    get:
      summary: Top locations by metric
      description: >
        Returns a list of locations sorted by a specific metric,
        in ascending or descending order.
        Supports the use case "Top by metric".
      operationId: getTopLocations
      parameters:
        - name: metric
          in: query
          required: true
          description: Metric to use for sorting.
          schema:
            type: string
            enum:
              - pli
              - hpi
              - crime
              - air_quality
              - transport
              - health
              - unemployment
              - working_hours
              - life_expectancy
        - name: order
          in: query
          required: false
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          required: false
          description: Number of results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 15
            default: 5
      responses:
        "200":
          description: Sorted list returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    rank:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: "Portugal"
                    value:
                      type: number
                      example: 67.0
        "400":
          description: Invalid or missing parameters.
          content:
            application/json:
              schema:
                type: string
                example: "Invalid or missing metric"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: string
                example: "Internal server error"


components:

  schemas:

    LocationSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Portugal"
        country_code:
          type: string
          example: "PT"

    Metric:
      type: object
      properties:
        name:
          type: string
          enum:
            - pli
            - hpi
            - crime
            - air_quality
            - transport
            - health
            - unemployment
            - working_hours
            - life_expectancy
          example: "crime"
        label:
          type: string
          example: "Crime Rate"
        value:
          type: number
          example: 25.1
        unit:
          type: string
          example: "per 100k inhabitants"
        year:
          type: integer
          example: 2023
name: Build and Push db-importer

on:
  push:
    branches: [main]
    paths:
      - 'dataBaseService/importer/**'
      - 'dataBaseService/spreadsheets/**'
      - '.github/workflows/build-db-importer.yml'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: cloud-computing-proj-2026
          
      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: dataBaseService
          file: dataBaseService/importer/Dockerfile
          push: true
          tags: |
            europe-west1-docker.pkg.dev/cloud-computing-proj-2026/cc2026/db-importer:latest
            europe-west1-docker.pkg.dev/cloud-computing-proj-2026/cc2026/db-importer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

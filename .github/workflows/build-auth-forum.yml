name: Build and Push auth-forum-service

on:
  push:
    branches: [main]
    paths:
      - 'auth-forum-service/**'
      - '.github/workflows/build-auth-forum.yml'

jobs:
  # ── Stage 1: Testes ────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Unit Tests
        working-directory: auth-forum-service
        run: mvn test -Dtest="AuthServiceTest,ForumServiceTest" -q

      - name: Run Integration Tests
        working-directory: auth-forum-service
        run: mvn test -Dtest="AuthControllerIntegrationTest,ForumControllerIntegrationTest" -q

  # ── Stage 2: Build + Push ──────────────────────────────────────────────────
  build-push:
    runs-on: ubuntu-latest
    needs: test    # ← só corre se os testes passarem
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: cloud-computing-proj-2026

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: auth-forum-service
          file: auth-forum-service/Dockerfile
          push: true
          tags: |
            europe-west1-docker.pkg.dev/cloud-computing-proj-2026/cc2026/auth-forum-service:latest
            europe-west1-docker.pkg.dev/cloud-computing-proj-2026/cc2026/auth-forum-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
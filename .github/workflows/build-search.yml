name: Build and Push searchService

on:
  push:
    branches: [main]
    paths:
      - 'searchService/**'
      - '.github/workflows/build-search.yml'

jobs:

  # Stage 1: Unit tests (no external services)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: mvn -f searchService/pom.xml test -Dgroups=unit

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-unit-test-report
          path: searchService/target/surefire-reports/

  # Stage 2: Integration tests (Testcontainers – PostgreSQL + Redis)
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run integration tests
        run: mvn -f searchService/pom.xml test -Dgroups=integration

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-integration-test-report
          path: searchService/target/surefire-reports/

  # Stage 3: Build & push Docker image to GCP Artifact Registry
  build-push:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: cloud-computing-proj-2026

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: searchService
          file: searchService/Dockerfile
          push: true
          tags: |
            europe-west1-docker.pkg.dev/cloud-computing-proj-2026/cc2026/search-service:latest
            europe-west1-docker.pkg.dev/cloud-computing-proj-2026/cc2026/search-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
